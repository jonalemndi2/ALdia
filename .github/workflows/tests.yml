# ─────────────────────────────────────────────────────────────────────────────
# Pruebas automáticas en cada push y cada pull request.
#
# Hasta ahora la suite existía pero nadie garantizaba que se corriera: se
# confiaba en que el contribuyente se acordara. Esto lo corre siempre.
#
# El sistema se instala en Windows, Linux y macOS, así que la suite corre en los
# tres: si algo depende del sistema operativo (rutas con backslash, permisos de
# archivo, mayúsculas en nombres, finales de línea), se ve acá y no en la PC del
# comercio. Que ande en la máquina de quien programa no prueba nada.
# ─────────────────────────────────────────────────────────────────────────────
name: Pruebas

on:
  push:
  pull_request:

# Solo lectura del repositorio: este workflow no publica ni escribe nada.
permissions:
  contents: read

# Si se empujan dos commits seguidos a la misma rama, cancelar la corrida vieja.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. La suite, con las dependencias en su versión MÁS NUEVA (requirements.txt
  #    declara rangos). Es a propósito: así nos enteramos acá de que una versión
  #    nueva de FastAPI o Pydantic rompe algo, en vez de enterarnos el día que
  #    un comercio corre `pip install`.
  #
  #    3.10 es el mínimo que declara el README; 3.13 es la versión moderna que
  #    baja hoy quien instala Python por primera vez. Las dos tienen que andar.
  #
  #    Las combinaciones no son el producto cruzado completo, y eso es a
  #    propósito: en Linux se prueban las dos puntas del rango de Python porque
  #    es donde más barato sale, y en macOS y Windows alcanza con una versión
  #    para detectar lo que ahí se rompe, que son diferencias del SISTEMA (rutas,
  #    permisos, finales de línea), no de la versión de Python.
  # ───────────────────────────────────────────────────────────────────────────
  pruebas:
    name: pytest · ${{ matrix.so }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { so: ubuntu-latest,  python: '3.10' }
          - { so: ubuntu-latest,  python: '3.13' }
          - { so: macos-latest,   python: '3.13' }
          - { so: windows-latest, python: '3.13' }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          # Cachea la carpeta de descargas de pip: sin esto cada corrida vuelve
          # a bajar lxml, cryptography y compañía.
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Dejar constancia de que se instalo
        run: |
          python -VV
          python -m pip freeze

      - name: Correr la suite
        run: python -m pytest tests/ -ra --tb=short

  # ───────────────────────────────────────────────────────────────────────────
  # 2. La misma suite con el LOCK, o sea con las versiones exactas que se le
  #    recomiendan a un comercio. Si este job falla, el archivo que la gente
  #    instala en producción está roto — que es peor que el otro.
  # ───────────────────────────────────────────────────────────────────────────
  lock:
    name: pytest · versiones del lock
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Instalar las versiones fijadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock.txt
          # pytest no es dependencia del sistema, solo de las pruebas. httpx sí
          # lo es (backend/routers/pendientes.py) y viene en el lock.
          python -m pip install pytest
          # Que ninguna de las dos instalaciones haya dejado versiones incompatibles.
          python -m pip check

      - name: Correr la suite
        run: python -m pytest tests/ -ra --tb=short

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Que los instaladores de Unix funcionen DE VERDAD.
  #
  #    La suite prueba la lógica del sistema, no la instalación. Este job corre
  #    `instalar.sh` y `iniciar_web.sh` tal cual los va a correr un comercio, y
  #    después le pega al servidor por HTTP: es la única forma de enterarse acá
  #    —y no en la PC del cliente— de que falta una dependencia en
  #    requirements.txt o de que el servidor no llega a levantar.
  #
  #    Justamente así apareció que httpx no estaba declarado: la suite pasaba
  #    entera (el entorno de desarrollo lo tenía por requirements-dev.txt) y el
  #    servidor recién instalado moría en el import de los routers.
  # ───────────────────────────────────────────────────────────────────────────
  instaladores:
    name: instalar.sh + iniciar_web.sh · ${{ matrix.so }}
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Que sean ejecutables y que bash los entienda
        run: |
          test -x instalar.sh    || { echo "instalar.sh no tiene permiso de ejecución"; exit 1; }
          test -x iniciar_web.sh || { echo "iniciar_web.sh no tiene permiso de ejecución"; exit 1; }
          bash -n instalar.sh
          bash -n iniciar_web.sh

      - name: Sin CRLF (rompe el shebang en Unix)
        run: |
          python - <<'FIN'
          import sys
          for archivo in ("instalar.sh", "iniciar_web.sh"):
              if b"\r" in open(archivo, "rb").read():
                  sys.exit(f"{archivo} tiene finales de linea CRLF: "
                           "bash no va a encontrar el interprete.")
          print("ok - los dos con LF.")
          FIN

      - name: Instalar como lo hace un comercio
        run: ./instalar.sh

      - name: Levantar el servidor y comprobar que responde
        run: |
          ALDIA_SIN_NAVEGADOR=1 ALDIA_PORT=8000 ./iniciar_web.sh > servidor.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "El servidor respondió a los $i intentos."
              curl -fsS http://127.0.0.1:8000/api/health; echo
              # Que sirva también el frontend, no solo la API.
              curl -fsS -o /dev/null -w 'index.html -> HTTP %{http_code}\n' http://127.0.0.1:8000/
              exit 0
            fi
            sleep 1
          done
          echo "El servidor no respondió en 60 segundos. Salida:"
          cat servidor.log
          exit 1

      - name: Qué dijo el servidor
        if: always()
        run: cat servidor.log || true

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Que no se cuele ningún secreto.
  #
  #    Esto es un sistema de facturación fiscal: el archivo de base de datos
  #    tiene CUIT de clientes y hashes de contraseñas, la clave de firma permite
  #    fabricarse un token de administrador, y con el certificado de AFIP un
  #    tercero factura en nombre del comercio. El .gitignore ya los excluye;
  #    este job existe para que siga siendo así dentro de dos años.
  # ───────────────────────────────────────────────────────────────────────────
  secretos:
    name: Sin secretos versionados
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Que no haya secretos en el repositorio
        run: |
          echo "Buscando archivos que nunca deberían estar versionados..."
          encontrados=$(git ls-files -- \
            '.aldia_secret' 'backend/.aldia_secret' \
            'backend/.afip_ta*' '*.ta.xml' \
            'backend/aldia.db' '*.sqlite' '*.sqlite3' '*.db' \
            'backend/copias/*' 'copias/*' \
            '*.pem' '*.key' '*.p12' '*.pfx' '*.crt' '*.csr' \
            '.env')
          if [ -n "$encontrados" ]; then
            echo
            echo "FALLA: hay secretos o datos del comercio versionados:"
            echo "$encontrados" | sed 's/^/  /'
            echo
            echo "Sacalos del historial (no alcanza con borrarlos en un commit"
            echo "nuevo: siguen estando) y, si eran reales, dalos por filtrados:"
            echo "rotá la clave de sesión y volvé a tramitar el certificado de AFIP."
            exit 1
          fi
          echo "  ok — ninguno."

      - name: Que el .gitignore los siga excluyendo
        run: |
          echo "Verificando que .gitignore cubra cada caso..."
          faltan=0
          for ruta in \
            backend/.aldia_secret \
            backend/aldia.db \
            backend/copias/aldia-2026-01-01.db \
            backend/aldia.db-wal \
            backend/.afip_ta_wsfe.json \
            certificados/comercio.pem \
            certificados/comercio.key \
            certificados/comercio.p12 \
            certificados/comercio.pfx \
            .env
          do
            if git check-ignore -q "$ruta"; then
              echo "  ok       $ruta"
            else
              echo "  FALLA    $ruta  ← ya no lo excluye el .gitignore"
              faltan=1
            fi
          done
          if [ "$faltan" = "1" ]; then
            echo
            echo "Alguien aflojó el .gitignore. Cualquiera de esos archivos que"
            echo "llegue a GitHub es una filtración: base de datos del comercio,"
            echo "clave de firma de sesiones o identidad fiscal ante AFIP."
            exit 1
          fi
          echo "  ok — todos excluidos."
